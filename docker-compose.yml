version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-backend
    restart: always
    ports:
      - "8000:8080"
    environment:
      - DATABASE_URL=sqlite:///./data/quiz.db
    volumes:
      - ./backend/data:/app/backend/data
  # El frontend en un VPS se suele servir con Nginx directamente fuera de Docker
  # o mediante un contenedor de Nginx que sirva los archivos estáticos.
  # Para mantenerlo simple, esta config se centra en el motor (backend).
